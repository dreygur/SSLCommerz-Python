[project]
name = "sslcommerz_python_api"
version = "2.0.0"
authors = [{ name = "Rakibul Yeasin", email = "ryeasin03@gmail.com" }]
description = "SSLCommerz payment gateway wrapper for Python web applications."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
]

dependencies = ["requests>=2.32.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14"]

[project.urls]
Homepage = "https://github.com/dreygur/SSLCommerz-Python"
Issues = "https://github.com/dreygur/SSLCommerz-Python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
